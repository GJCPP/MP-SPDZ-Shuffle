# C/C++ with GCC
# Build your C/C++ project with GCC using make.
# Add steps that publish test results, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/c-cpp/gcc

trigger:
- main
- master
- to-publish

pool:
  vmImage: 'ubuntu-24.04'

steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y automake build-essential clang cmake curl git libboost-all-dev libgmp-dev libntl-dev libsodium-dev libssl-dev libtool openssl python3-gmpy2 python3-networkx python3-venv
      python3 -m venv .venv
      .venv/bin/python -m pip install -r requirements-runtime.txt
    displayName: Install build and benchmark dependencies
  - script: |
      make setup
  - script:
      echo USE_NTL=1 >> CONFIG.mine
  - script:
      echo MY_CFLAGS += -DFEWER_PRIMES >> CONFIG.mine
  - script:
      echo MY_CFLAGS += -DFEWER_RINGS >> CONFIG.mine
  - script:
      echo MY_CFLAGS += -DCOMP_SEC=10 >> CONFIG.mine
  - script:
      echo CXX = clang++ >> CONFIG.mine
  - script:
      make arithmetic rep-bin yao
  - script:
      Scripts/setup-ssl.sh 4
  - script:
      skip_binary=1 Scripts/test_tutorial.sh -X
  - script: |
      make my_shuffle_main.x
    displayName: Build shuffle executable
  - script: |
      set -euo pipefail
      make test-shuffle PYTHON=.venv/bin/python
      make test-shuffle-rounds PYTHON=.venv/bin/python
    displayName: Test shuffle correctness and reject tampering
  - script: |
      set -euo pipefail
      Scripts/setup-ssl.sh --ensure 3
      smoke_dir=$(mktemp -d)
      SHUFFLE_BENCHMARK_DIR="$smoke_dir" \
      SHUFFLE_BENCHMARK_PARTIES=3 \
      SHUFFLE_BENCHMARK_LOGSZ=6 \
      SHUFFLE_BENCHMARK_LOGBATCH=4 \
      timeout --kill-after=5s 120s .venv/bin/python -u my_benchmark.py my_shuffle 15000
      test -s "$smoke_dir/my_shuffle_total_time_n_3.csv"
      .venv/bin/python -m unittest discover -s tests -v
    displayName: Smoke-test benchmark and summaries
